<!doctype html>
<html lang="en" data-world="typewell">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Castor · Typewell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600&amp;family=Martian+Mono:wght@400;500&amp;family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&amp;display=swap">
<link rel="stylesheet" href="../../engine/engine.css">
<link rel="stylesheet" href="../../engine/writing.css">
<link rel="stylesheet" href="../../engine/highlight.css">
<link rel="stylesheet" href="../../engine/signature.css">
<link rel="stylesheet" href="../../engine/touch.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="../../engine/capsule.css">
</head>
<body>

<div id="frame" data-size="computer">
  <div id="app">
    <header id="topbar" class="mast"></header>
    <aside id="dock-left" class="dock" data-side="left" aria-label="Left dock"></aside>
    <main id="page">
      <div class="page-scroll">
        <article id="page-article" class="page-column"></article>
      </div>
      <div class="saves-rail" id="saves-rail" aria-label="Saves"></div>
    </main>
    <aside id="dock-right" class="dock" data-side="right" aria-label="Right dock"></aside>
    <footer id="changes-notice" hidden></footer>
    <footer id="footline" class="footline"></footer>
  </div>
</div>

<script id="castor-data" type="application/json">{"world":"typewell"}</script>
<script src="../../engine/people.js"></script>
<script src="../../engine/highlight.js"></script>
<script src="../../engine/md.js"></script>
<script src="../../engine/diff.js"></script>
<script src="../../engine/editor.js"></script>
<script src="../../engine/commands.js"></script>
<script src="../../engine/search.js"></script>
<script src="../../engine/fonts.js"></script>
<script src="../../engine/panels.js"></script>
<script src="../../engine/outline.js"></script>
<script src="../../engine/files.js"></script>
<script src="../../engine/drafts.js"></script>
<script src="../../engine/footnotes.js"></script>
<script src="../../engine/comments.js"></script>
<script src="../../engine/mentions.js"></script>
<script src="../../engine/links.js"></script>
<script src="../../engine/changes.js"></script>
<script src="../../engine/canvas.js"></script>
<script src="../../engine/island.js"></script>
<script src="../../engine/walkthrough.js"></script>
<script src="../../engine/review.js"></script>
<script src="../../engine/save-status.js"></script>
<script src="../../engine/popovers.js"></script>
<script src="../../engine/app.js"></script>
<script src="../../engine/capsule.js"></script>
<script src="../../engine/settings-sheet.js"></script>
<!-- The world's own behaviour, after the engine has mounted: the light rests on
     the first sentence until the caret takes it. See world.js. -->
<script src="world.js"></script>
</body>
</html>
